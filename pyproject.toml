[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eddqc"
version = "0.1.0"
description = "Automated environmental QA/QC and EDD validation engine"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyodbc>=5.0",
    "sqlalchemy>=2.0",
    "openpyxl>=3.1",
    "geopandas>=1.0",
    "pyogrio>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
eddqc = "eddqc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
